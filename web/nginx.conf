# DualityRF homepage — served as a static site.
# Copied to /etc/nginx/conf.d/default.conf (i.e. inside the stock http{} block).

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # Compress the text assets (the STL is binary and left as-is).
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # The 27 MB model: correct type, long cache, and byte-range support so the
    # browser can stream it (and STLLoader can report real progress).
    location = /public/Raspberry_Pi_3.STL {
        default_type  application/octet-stream;
        add_header    Cache-Control "public, max-age=2592000, immutable";
        add_header    Accept-Ranges bytes;
    }

    # Fingerprint-free static assets: a week of caching is plenty.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        add_header  Cache-Control "public, max-age=604800";
        try_files   $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Small hardening niceties.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    server_tokens off;
}
